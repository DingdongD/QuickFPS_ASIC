name: Functional and Cycle Models

on:
  push:
    branches:
      - feature/complete-functional-core
      - feature/cycle-accurate-system
      - feature/closed-loop-cycle-simulator
  pull_request:

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Build host preprocessing
        run: |
          cmake -S HOST -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --parallel 2

      - name: Test KD-tree preprocessing and metadata generation
        run: |
          build/host/quickfps_preprocess \
            --input HOST/test_points.xyz \
            --buckets 2 \
            --samples 4 \
            --repeat 2 \
            --out build/preprocessed
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/preprocessed')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['point_count'] == 8, manifest
          assert manifest['bucket_count'] == 2, manifest
          assert manifest['bucket_m_register'] == 1, manifest
          assert manifest['sample_count'] == 4, manifest
          assert len((root / 'coords.hex').read_text().splitlines()) == 8
          assert len((root / 'dist.hex').read_text().splitlines()) == 8
          assert len((root / 'buckets.hex').read_text().splitlines()) == 2
          assert len((root / 'golden_indices.txt').read_text().splitlines()) == 4
          assert (root / 'reorder_map.txt').read_text().splitlines() == [
              f'{index} {index}' for index in range(8)
          ]
          assert [int(value) for value in
                  (root / 'golden_indices.txt').read_text().splitlines()] == [0, 7, 3, 5]
          PY

      - name: Run RTL functional regressions
        run: bash scripts/run_functional_core_tests.sh

      - name: Run cycle model unit tests
        env:
          PYTHONPATH: cmodel
        run: python3 -m unittest discover -s cmodel/tests -v

      - name: Run strict closed-loop FPS from KD-tree partitions
        env:
          PYTHONPATH: cmodel
        run: |
          python3 -m quickfps_cycle \
            --preprocessed build/preprocessed \
            --samples 4 \
            --chunk-points 4 \
            --bucket-fifo-depth 2 \
            --far-fifo-depth 2 \
            --output build/closed_loop_result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('build/closed_loop_result.json').read_text())
          assert result['mode'] == 'closed-loop'
          assert result['config']['scheduler'] == 'closed-loop-strict-pre-edge'
          assert result['sampled_indices'] == [0, 7, 3, 5], result
          assert result['sampled_indices_original'] == [0, 7, 3, 5], result
          assert result['matches_golden'] is True
          assert result['iterations'] == 3
          assert result['counters']['bucket_cd_inputs'] == 6
          assert result['counters']['issued_buckets'] == result['counters']['bucket_completions']
          assert result['counters']['functional_distance_evaluations'] > 0
          assert result['memory_stats']['accepted'] == result['memory_stats']['completed']
          assert result['final_functional_state']['finite_mdt_count'] == 8
          PY

      - name: Generate algorithm trace and simulate replay cycles
        env:
          PYTHONPATH: cmodel
        run: |
          python3 cmodel/generate_workload.py \
            --preprocessed build/preprocessed \
            --samples 4 \
            --output build/quickfps_workload.json
          python3 -m quickfps_cycle \
            --workload build/quickfps_workload.json \
            --chunk-points 4 \
            --bucket-fifo-depth 2 \
            --far-fifo-depth 2 \
            --output build/cycle_result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          workload = json.loads(Path('build/quickfps_workload.json').read_text())
          result = json.loads(Path('build/cycle_result.json').read_text())
          assert workload['metadata']['expected_sequence'] == [0, 7, 3, 5]
          assert result['mode'] == 'trace-replay'
          assert result['iterations'] == 3
          assert result['cycles'] > 0
          assert result['counters']['issued_buckets'] == result['counters']['bucket_completions']
          assert result['counters']['dram_transactions'] > result['counters']['axi_bursts']
          PY

      - name: Validate replay cycle-model assumptions against RTL traces
        run: |
          python3 cmodel/validate_rtl_cycles.py \
            --log-dir build/functional \
            --workload build/quickfps_workload.json \
            --cycle-result build/cycle_result.json \
            --reorder-map build/preprocessed/reorder_map.txt \
            --output build/rtl_cycle_validation.json

  dramsim3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DRAMsim3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libconfig++-dev

      - name: Build official pinned DRAMsim3 bridge
        run: bash scripts/build_dramsim3_bridge.sh

      - name: Create DRAMsim3 smoke workload
        env:
          PYTHONPATH: cmodel
        run: |
          python3 - <<'PY'
          from quickfps_cycle.workload import synthetic_workload
          synthetic_workload([300, 129, 17], iterations=2).save('build/dramsim3_workload.json')
          PY

      - name: Run cycle model with official DRAMsim3
        env:
          PYTHONPATH: cmodel
        run: |
          LIB=$(find build/dramsim3_bridge -name 'libquickfps_dramsim3_bridge.so' -print -quit)
          CFG=build/dramsim3_bridge/_deps/dramsim3_external-src/configs/DDR4_8Gb_x8_2400.ini
          test -f "$LIB"
          test -f "$CFG"
          python3 -m quickfps_cycle \
            --workload build/dramsim3_workload.json \
            --chunk-points 128 \
            --bucket-fifo-depth 2 \
            --far-fifo-depth 2 \
            --dramsim3-lib "$LIB" \
            --dramsim3-config "$CFG" \
            --dramsim3-output-dir build/dramsim3_stats \
            --output build/dramsim3_cycle_result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/dramsim3_cycle_result.json').read_text())
          assert result['memory_backend'] == 'dramsim3'
          assert result['cycles'] > 0
          assert result['counters']['issued_buckets'] == result['counters']['bucket_completions']
          assert result['counters']['dram_transactions'] > 0
          PY
